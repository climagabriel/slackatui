[package]
name = "slack-tui"
version = "0.1.0"
edition = "2021"
description = "Read the local slackdump archives in the terminal: conversations, messages, threads."
publish = false

[dependencies]
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
unicode-width = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = "3"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha1 = "0.10"
scraper = "0.24"
pulldown-cmark = { version = "0.13", default-features = false }
unicode-segmentation = "1"

[profile.release]
opt-level = 2
strip = true
