[package]
name = "slack-tui"
version = "0.1.0"
edition = "2021"
description = "Read the local slackdump archives in the terminal: conversations, messages, threads."
publish = false

[dependencies]
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
unicode-width = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = "3"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha1 = "0.10"

[profile.release]
opt-level = 2
strip = true
